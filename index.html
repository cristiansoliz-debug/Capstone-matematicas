<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Travesía de Sir Papaleta</title>
    <style>
        /* FRONTEND: Diseño y Estilos (CSS) */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #game-container {
            background-color: #242424;
            width: 850px;
            max-width: 95%;
            border: 4px solid #5a5a5a;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #scene-header {
            background-color: #0b2d4c;
            padding: 15px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            border-bottom: 4px solid #5a5a5a;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #f4d35e;
        }
        #story-box {
            padding: 25px;
            font-size: 18px;
            line-height: 1.6;
            min-height: 250px;
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #scene-image {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 5px;
            border: 2px solid #444;
            margin-bottom: 20px;
            display: none; /* Se oculta si no hay imagen */
        }
        #story-text {
            width: 100%;
            text-align: justify;
        }
        .math-problem {
            background-color: #0f2027;
            padding: 20px;
            border-left: 5px solid #20bf55;
            margin: 20px 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 17px;
            width: 95%;
            color: #a8e6cf;
        }
        #options-container {
            display: flex;
            flex-direction: column;
            padding: 20px;
            background-color: #242424;
            border-top: 4px solid #5a5a5a;
        }
        .option-btn {
            background-color: #f4d35e;
            color: #000;
            border: none;
            padding: 15px;
            margin: 8px 0;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .option-btn:hover {
            background-color: #ee9b00;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- FRONTEND: Estructura HTML -->
    <div id="game-container">
        <div id="scene-header">Título</div>
        <div id="story-box">
            <!-- Nota: Aquí puedes cambiar los enlaces src por tus imágenes locales, ej: src="img/troll.jpg" -->
            <img id="scene-image" src="" alt="Imagen de la escena">
            <p id="story-text">Historia...</p>
            <div id="math-box" class="math-problem" style="display: none;"></div>
        </div>
        <div id="options-container">
            <!-- Botones generados por JS -->
        </div>
    </div>

    <!-- BACKEND / LÓGICA: JavaScript -->
    <script>
        // BASE DE DATOS DE ESCENARIOS
        const storyData = {
            inicio: {
                title: "La Travesía de Sir Papaleta",
                text: "El reino ha caído bajo la influencia de la malvada Bruja Ana Catalena, quien secuestró a la princesa Mercy. Sir Papaleta Tercero inicia su viaje armado solo con una humilde daga, confiando en la 'Lógica Arcana' que le enseñó la Gran Bruja Ashe.",
                image: "papaletainicio.jpg",
                math: "",
                options: [ { text: "Comenzar la aventura", next: "escenario1_intro" } ]
            },
            
            // ESCENARIO 1: TROLL
            escenario1_intro: {
                title: "Adentrándose en el Bosque",
                text: "Sir Papaleta se adentra en la espesura. De repente, la tierra tiembla y un colosal Troll verde y repulsivo bloquea el paso. Al invocar la Espada del Árbol Escarlata, el caballero nota una barrera mágica parpadeando alrededor del monstruo.",
                image: "troll.jpg",
                math: "",
                options: [ { text: "Analizar la barrera del Troll", next: "escenario1_prob" } ]
            },
            escenario1_prob: {
                title: "Escenario 1: El Despertar de la Espada",
                text: "Para atravesar la barrera mágica de Ana Catalena, debes alinear la frecuencia de tu Espada (Conjunto A) con las fisuras de la armadura del Troll (Conjunto B).",
                image: "", // Sin imagen para concentrarse en las mates
                math: "A = { x ∈ N | 1 < x ≤ 7 }\nB = { x ∈ Z | x es par, -2 ≤ x ≤ 7 }\n\n¿Cuál es la intersección (A ∩ B) para tu Diagrama de Venn?",
                options: [
                    { text: "A ∩ B = {2, 3, 4}", next: "gameover" },
                    { text: "A ∩ B = {2, 4, 6}", next: "escenario2_intro" }
                ]
            },

            // ESCENARIO 2: GNOMOS
            escenario2_intro: {
                title: "Emboscada en los Susurros",
                text: "Con el Troll derrotado, obtienes el Arco del Viento. Pero el descanso es breve. Una horda de gnomos comienza a correr a tu alrededor a una velocidad vertiginosa, creando ilusiones ópticas para confundirte.",
                image: "gnomo1.jpg",
                math: "",
                options: [ { text: "Tensar el arco y preparar el encantamiento", next: "escenario2_prob" } ]
            },
            escenario2_prob: {
                title: "Escenario 2: La Precisión del Arco",
                text: "Atacar a ciegas desperdiciaría flechas en ilusiones. Papaleta debe usar un encantamiento basado en una Función Inyectiva para asegurar que cada flecha impacte a un gnomo distinto (salida única).",
                image: "gnomo.jpg",
                math: "¿La trayectoria mágica f(x) = 3x - 7 es una Función Inyectiva?\n(Pista: si f(x1) = f(x2), ¿x1 = x2?)",
                options: [
                    { text: "Falso. Dos flechas impactarían al mismo gnomo.", next: "gameover" },
                    { text: "Verdadero. Salidas iguales implican entradas iguales.", next: "escenario3_intro" }
                ]
            },

            // ESCENARIO 3: CÍCLOPES
            escenario3_intro: {
                title: "Las Montañas Quebradas",
                text: "Al pie del volcán, encuentras el mítico Escudo del Guardián. De inmediato, Gigantes y Cíclopes emergen de las rocas y comienzan a arrojar peñascos masivos en una lluvia incesante. El escudo normal se romperá si no lo encantas.",
                image: "escudo.jpg",
                math: "",
                options: [ { text: "Invocar hechizo defensivo", next: "escenario3_prob" } ]
            },
            escenario3_prob: {
                title: "Escenario 3: La Fortaleza del Escudo",
                text: "Usas Inducción Matemática para demostrar que tu escudo condensará la fuerza de avalanchas infinitas (n). Supusiste que para 'k' golpes, resiste k². Ahora recibes el golpe definitivo (k+1).",
                image: "",
                math: "Demuestra: k² + (2(k+1) - 1) = ?\n\nk² + 2k + 2 - 1\nk² + 2k + 1",
                options: [
                    { text: "(k+1)²", next: "climax_intro" },
                    { text: "2k+1", next: "gameover" }
                ]
            },

            // CLÍMAX: LA BRUJA (Expandido)
            climax_intro: {
                title: "El Portal Radiante",
                text: "Has llegado a la guarida. Frente al portal hay un Yunque Mágico. El cartel dice: 'Tienes 4 intentos para imbuir tus 3 armas con las 3 bendiciones que son la debilidad exacta de La Gran Bruja (existen 7 bendiciones). Falla y la puerta se sella para siempre'.",
                image: "bendicion.jpg",
                math: "",
                options: [ { text: "Fase 1: Calcular combinaciones a lo bruto", next: "climax_fase1" } ]
            },
            climax_fase1: {
                title: "El Clímax - Fase 1: El Testeo Bruto",
                text: "En un momento de pánico, calculas tus opciones. Como el orden de las armas en el yunque no importa, aplicas combinaciones para 7 bendiciones tomadas de 3 en 3.",
                image: "",
                math: "C(7,3) = 7! / [3! * (7-3)!] \nC(7,3) = 210 / 6 = 35 combinaciones posibles.\n\n¡Tener 35 combinaciones y solo 4 intentos es un suicidio! Necesitas investigar.",
                options: [ { text: "Fase 2: Analizar el Libro de los Gnomos", next: "climax_fase2" } ]
            },
            climax_fase2: {
                title: "El Clímax - Fase 2: Probabilidad Genética",
                text: "El libro muestra que el Bisabuelo era débil a (3) y (4). Una pista dice: 'Su nacimiento fue un milagro imposible'. Aplicas el Binomio de Newton a la genética de 4ta generación de la bruja.",
                image: "",
                math: "(0.9x + 0.1y)^4\nExpansión: ... + 0.0036 x^1.y^3 + 0.0001 x^0.y^4\n\nEl coeficiente 0.0001 significa que hay un 0.01% de NO heredar las debilidades del ancestro. ¡La bruja es el milagro! Descartas (3) y (4).",
                options: [ { text: "Fase 3: Recalcular y usar Tarjeta Mágica", next: "climax_fase3" } ]
            },
            climax_fase3: {
                title: "El Clímax - Fase 3: La Decisión de la Tarjeta",
                text: "Sin la (3) y (4), te quedan 5 bendiciones. C(5,3) = 10 combinaciones. Aún son demasiadas. Sacas la Tarjeta Mágica, que te obliga a elegir una sola ayuda antes de destruirse.",
                image: "",
                math: "Opción A (Saber 1 debilidad): Faltan 2 armas entre 4 bendiciones restantes. C(4,2) = 6 combos.\n\nOpción B (Saber 1 bendición inútil): Faltan 3 armas entre 4 bendiciones útiles restantes. C(4,3) = 4 combos.",
                options: [
                    { text: "Opción A: (6 combos > 4 intentos)", next: "gameover" },
                    { text: "Opción B: (4 combos = 4 intentos)", next: "victoria" }
                ]
            },

            // FINALES
            gameover: {
                title: "La Lógica Falló",
                text: "Tus cálculos fueron incorrectos. La magia se volvió inestable y fuiste derrotado. La princesa Mercy seguirá cautiva. Recuerda: las matemáticas no perdonan errores de procedimiento.",
                image: "muerte.png",
                math: "",
                options: [ { text: "Reiniciar la aventura", next: "inicio" } ]
            },
            victoria: {
                title: "¡Victoria Arcana!",
                text: "¡Elegiste la Opción B! Al eliminar otra bendición inútil, el yunque te garantizó el éxito en tus 4 intentos. Las armas resonaron, el portal se abrió y la Bruja fue despojada de su poder. Has rescatado a la princesa demostrando que la mejor arma es el intelecto.",
                image: "princesa.jpg",
                math: "",
                options: [ { text: "Volver a jugar", next: "inicio" } ]
            }
        };

        // CONTROLADOR DE ESCENAS
        const headerEl = document.getElementById('scene-header');
        const textEl = document.getElementById('story-text');
        const imageEl = document.getElementById('scene-image');
        const mathBoxEl = document.getElementById('math-box');
        const optionsContainer = document.getElementById('options-container');

        function loadScene(sceneKey) {
            const scene = storyData[sceneKey];
            
            headerEl.textContent = scene.title;
            textEl.textContent = scene.text;

            // Manejo de la imagen
            if (scene.image && scene.image !== "") {
                imageEl.src = scene.image;
                imageEl.style.display = "block";
            } else {
                imageEl.style.display = "none";
            }

            // Manejo de problemas matemáticos
            if (scene.math && scene.math !== "") {
                mathBoxEl.innerText = scene.math;
                mathBoxEl.style.display = "block";
            } else {
                mathBoxEl.style.display = "none";
            }

            // Generar botones
            optionsContainer.innerHTML = '';
            scene.options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option.text;
                btn.onclick = () => loadScene(option.next);
                optionsContainer.appendChild(btn);
            });
        }

        // Iniciar el juego
        loadScene('inicio');
    </script>
</body>
</html>
